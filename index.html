<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mboa Market</title>

    <!-- Gestion du CSS -->
    <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <!-- ENTETE DE PAGE -->
    <header id="entete">
        <div class="container">
            <div id="logo">
                <a href="#">
                    Mboa<span>Market</span>
                </a>
            </div>

            <div id="menu">
                <a href="#" id="btn_panier">
                    Panier 
                    <span><i class="fa-solid fa-cart-shopping"></i></span>
                    <span id="nb_articles" class="hide">0</span>
                </a>
            </div>
        </div>
    </header>




    <!-- CONTENEUR DE LA PAGE -->
    <main id="conteneur">
        <!-- SECTION CARROUSEL -->
        <section id="carrousel">
        </section>


        <!-- SECTION BOUTIQUE -->
        <section id="boutique">
            <div class="boutique_entete">
                <h2>Nos produits du Marché</h2>
                <p id="nb_resultats"></p>
            </div>

            <!-- Filtre de recherche de produits -->
            <div class="boutique_outils">
                <div class="recherche">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="search" id="recherche" placeholder="Rechercher : poivre blanc, poulet ...." />
                </div>

                <select id="tri">
                    <option value="defaut">
                        Trier par : recommandés
                    </option>
                    <option value="prix_croissant">
                        Prix croissant
                    </option>
                    <option value="prix_decroissant">
                        Prix décroissant
                    </option>
                    <option value="nom">
                        Nom (A -> Z)
                    </option>
                </select>
            </div>

            <!-- Liste des categories -->
            <div id="categories"></div>

            <!-- Liste des produits -->
            <div id="produits"></div>
        </section>
    </main>





    <!-- PIED DE PAGE -->
    <footer id="pied">
        <p>
            <b>Mboa<span>Market</span></b>
            Le goût de ça, livré chez vous.
        </p>
        <p>
            Tél : 693 90 91 21 | Email : mboa@iuc.com
        </p>
    </footer>





    <!-- FENETRE MODAL PANIER -->
    <div id="modal_commande" class="hide">
        <div class="modal_container">
            <span id="modal_fermer">
                <i class="fa-solid fa-xmark"></i>
            </span>

            <form id="modal_form" method="POST" action="#">
                <fieldset class="commande_info">
                    <legend>Finaliser ma Commande</legend>

                    <div class="champ">
                        <label for="nom">Nom complet</label>
                        <input type="text" id="nom" name="nom" placeholder="Ex: M. TEJIOGNI" required />
                    </div>

                    <div class="champ">
                        <label for="telephone">Téléphone Mobile</label>
                        <input type="tel" id="telephone" name="telephone" placeholder="Ex: 6XXXXXXXX" required />
                    </div>

                    <div class="champ">
                        <label for="ville">Ville de livraison</label>
                        <select id="ville" name="ville">
                            <option value="DOUALA">DOUALA</option>
                            <option value="YAOUNDE">YAOUNDE</option>
                        </select>
                    </div>

                    <div class="champ">
                        <label for="paiement">Moyen de paiement</label>
                        <select id="paiement" name="paiement">
                            <option value="Orange Money">Orange Money</option>
                            <option value="MTN Mobile Money">MTN Mobile Money</option>
                        </select>
                    </div>
                </fieldset>

                <fieldset class="commande_produit">
                    <legend>Récapitulatif de la commande</legend>

                    <table border="0" cellpadding="4" cellspacing="8">
                        <thead>
                            <tr>
                                <th>Produit</th>
                                <th>PU (FCFA)</th>
                                <th>QTE</th>
                                <th>MONTANT (FCFA)</th>
                                <th>Options</th>
                            </tr>
                        </thead>
                        <tbody id="liste_produits">
                        </tbody>
                    </table>

                    <div id="total_commande"></div>

                    <div class="submit">
                        <input type="submit" id="btn_valider" value="Valider la commande" />
                    </div>
                </fieldset>
            </form>


            <div id="confirmation" class="hide"></div>
        </div>
    </div>





    <!-- Gestion du JavaScript -->
    <script type="text/javascript" src="js/carrousel.js"></script>
    <script type="text/javascript" src="js/boutique.js"></script>
    <script type="text/javascript" src="js/script.js"></script>
</body>
</html>
