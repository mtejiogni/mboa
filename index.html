<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mboa Market</title>

    <!-- Gestion du CSS -->
    <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <!-- ENTETE DE PAGE -->
    <header id="entete">
        <div class="container">
            <div id="logo">
                <a href="#">
                    Mboa<span>Market</span>
                </a>
            </div>

            <div id="menu">
                <a href="#" id="btn_panier">
                    Panier 
                    <span><i class="fa-solid fa-cart-shopping"></i></span>
                </a>
            </div>
        </div>
    </header>




    <!-- CONTENEUR DE LA PAGE -->
    <main id="conteneur">
        <!-- SECTION CARROUSEL -->
        <section id="carrousel">
            <div class="slide" style="background-image: url('images/slide1.jpg');">
                <div class="slide_container">
                    <div class="slide_text">
                        <h2>Titre 1</h2>
                        <p>
                            Lorem ipsum dolor sit amet consectetur adipisicing elit. 
                            Nihil iure inventore harum possimus alias soluta sapiente, 
                            cum debitis eaque aperiam quae deserunt obcaecati 
                            assumenda! Asperiores qui eos deserunt consequuntur 
                            excepturi.
                        </p>
                        <div class="buttons"> 
                            <a href="#">En Savoir +</a>
                        </div>
                    </div>
                </div>
            </div>


            <!-- Boutions d'options du slides -->
            <div class="slide_options">
                <span class="slide_left">
                    <i class="fa-solid fa-chevron-left"></i>
                </span>

                <span class="slide_right">
                    <i class="fa-solid fa-chevron-right"></i>
                </span>
            </div>
        </section>
    </main>

    <!-- Gestion du JavaScript -->
    <script type="text/javascript" src="js/script.js"></script>
</body>
</html>
